<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Karaoke für Smartphone, Tablet und Tesla-Browser. Liedliste, Player und LRC-Text." />
  <title>Tesla Karaoke</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script src="password.js"></script>
</head>
<body>
  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card">
      <h2>Karaoke</h2>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Passwort" required />
      <label class="remember"><input id="rememberLogin" type="checkbox" checked /> Login im Browser speichern</label>
      <button class="chip" type="submit">Öffnen</button>
      <p id="loginError" class="login-error" hidden>Passwort stimmt nicht</p>
    </form>
  </div>
  <div id="titleIntro" class="title-intro" hidden>
    <p id="introNumber" class="intro-number"></p>
    <h2 id="introTitle"></h2>
  </div>
  <header class="topbar">
    <button id="menuToggle" class="lieder-toggle" type="button" aria-expanded="true">Lieder</button>
    <button id="eigeneToggle" class="lieder-toggle" type="button" aria-pressed="false">eigene</button>
    <div id="listTools" class="list-tools" hidden>
      <button id="listSmaller" class="ghost" type="button" aria-label="Liste kleiner">A−</button>
      <button id="listLarger" class="ghost" type="button" aria-label="Liste größer">A+</button>
      <button id="splitLeft" class="ghost" type="button" aria-label="Liste schmaler">←</button>
      <button id="splitRight" class="ghost" type="button" aria-label="Liste breiter">→</button>
    </div>
    <div id="favTools" class="fav-tools-main" hidden>
      <button id="exportFav" class="chip" type="button">Favoriten exportieren</button>
      <button id="importFav" class="chip" type="button">Favoriten importieren</button>
      <button id="syncFav" class="chip" type="button">Synchronisieren</button>
    </div>
    <div class="top-actions">
      <button id="smallerBtn" class="ghost" type="button" aria-label="Schrift kleiner">A−</button>
      <button id="largerBtn" class="ghost" type="button" aria-label="Schrift größer">A+</button>
      <button id="fullscreenBtn" class="ghost" type="button">Vollbild</button>
      <a id="lyricsLink" class="ghost text-link" href="https://www.jw.org/en/library/music-songs/sing-out-joyfully/" target="_blank" rel="noopener">Text</a>
      <button id="refreshBtn" class="ghost" type="button" hidden>Neu laden</button>
      <button id="logoutBtn" class="ghost" type="button" hidden>Logout</button>
    </div>
  </header>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <header class="brand">
        <div>
          <p class="eyebrow">Sing Out Joyfully</p>
          <h1><button id="homeBtn" class="home-link" type="button">Karaoke</button></h1>
        </div>
        <button id="playerToggle" class="ghost player-icon" type="button" aria-label="Player" aria-pressed="true"></button>
        <button id="lyricSearchToggle" class="ghost" type="button" aria-label="im Liedtext suchen">⌕</button>
      </header>



<button onclick="alert('Button funktioniert')">
  WOL TEST2
</button>
``



      
      <div id="playlistBar" class="playlist-bar" hidden>
        <label id="playlistSelectWrap" class="search-wrap" hidden>
          <span class="sr-only">Liste</span>
          <select id="playlistSelect">
            <option value="">Liste wählen</option>
          </select>
        </label>
        <div id="playlistButtons" class="playlist-list"></div>
        <div id="playlistCreateBox" class="playlist-create" hidden>
          <input id="playlistName" type="text" placeholder="Name der Liste" autocomplete="off" />
          <button id="playlistCreate" class="chip" type="button">Erstellen</button>
        </div>
        <div id="playlistEdit" class="edit-tools" hidden>
          <input id="playlistRename" type="text" placeholder="Name ändern" autocomplete="off" />
          <button id="playlistRenameBtn" class="chip" type="button">Umbenennen</button>
          <button id="playlistDelete" class="chip danger" type="button">Löschen</button>
          <button id="playlistDeleteConfirm" class="chip danger" type="button" hidden>Wirklich löschen?</button>
        </div>
      </div>

      <label id="lyricSearchWrap" class="search-wrap" hidden>
        <span class="sr-only">im Liedtext suchen</span>
        <input id="lyricSearch" type="search" inputmode="search" placeholder="im Liedtext suchen" autocomplete="off" />
      </label>

      <label class="search-wrap">
        <span class="sr-only">Lied suchen</span>
        <input id="songSearch" type="search" inputmode="search" placeholder="Nummer oder Titel" autocomplete="off" />
      </label>

      <label class="search-wrap">
        <span class="sr-only">Kategorie</span>
        <select id="categoryFilter">
          <option value="">Alle Kategorien</option>
        </select>
      </label>
      <div id="categoryList" class="cat-list" hidden></div>

      <div class="filters">
        <button id="favoritesToggle" class="chip" type="button" aria-pressed="false">alle Lieder</button>
        <button id="shuffleBtn" class="chip" type="button" aria-pressed="false">Zufall</button>
        <span id="songCount" class="count">0</span>
      </div>

      <ul id="songList" class="song-list" aria-label="Lieder"></ul>
    </aside>
    <button id="toTopBtn" class="to-top" type="button" aria-label="Nach oben">↑</button>
    <button id="panelShow" class="chip panel-show" type="button" hidden>Panel</button>
    <div id="splitHandle" class="split-handle" hidden></div>

    <main class="stage">
      <section class="now">
        <div class="title-row" id="titleRow" hidden>
          <p id="currentNumber" class="eyebrow song-number">—</p>
          <button id="favoriteBtn" class="star-btn" type="button" aria-pressed="false" aria-label="Favorit" hidden>☆</button>
        </div>
        <h2 id="currentTitle">Königreichslieder</h2>
        <div class="meta-row">
          <p id="currentCategory" class="meta"></p>
          <p id="currentStatus">Bereit</p>
        </div>
      </section>

      <section id="lyrics" class="lyrics" aria-live="polite">
        <div id="startPanel" class="start-panel">
          <p class="eyebrow">Sing Out Joyfully</p>
          <img class="start-image" src="start-bg.png" alt="" />
          <div class="start-actions">
            <button id="playAllBtn" class="chip" type="button">alle Lieder</button>
            <button id="playFavBtn" class="chip" type="button">Favoriten</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="flyer" aria-label="Wiedergabe">
    <div class="transport">
      <button id="back15" class="round" type="button" aria-label="15 Sekunden zurück">−15</button>
      <button id="prevBtn" class="round nav" type="button" aria-label="Vorheriges Lied">◀</button>
      <button id="playBtn" class="round play" type="button" aria-label="Play">▶</button>
      <button id="nextBtn" class="round nav" type="button" aria-label="Nächstes Lied">▶</button>
      <button id="fwd15" class="round" type="button" aria-label="15 Sekunden vor">+15</button>
    </div>
    <div class="timeline">
      <p id="prevSong" class="nav-song">—</p>
      <div class="bar-row">
        <button id="currentTime" class="time-btn" type="button" title="Lied neu starten">0:00</button>
        <input id="progressBar" type="range" min="0" max="1000" value="0" aria-label="Position" />
        <span id="duration">0:00</span>
      </div>
      <canvas id="spectrum" class="spectrum" hidden></canvas>
      <button id="waveToggle" class="chip wave-toggle" type="button" hidden>Welle</button>
      <p id="nextSong" class="nav-song">—</p>
    </div>
  </footer>

  <div id="warnModal" class="login-gate" hidden>
    <form id="warnForm" class="login-card">
      <h2>ACHTUNG</h2>
      <p>Vorhandene Favoriten und Listen werden ersetzt.</p>
      <button class="chip" type="submit">Ersetzen</button>
      <button id="warnCancel" class="ghost" type="button">Abbrechen</button>
    </form>
  </div>
  <div id="codeModal" class="login-gate" hidden>
    <form id="codeForm" class="login-card">
      <p class="eyebrow">Favoriten</p>
      <button id="metaToggle" class="ghost meta-i" type="button" hidden>i</button>
      <h2 id="codeTitle">Code</h2>
      <div class="sync-choice">
        <button id="syncLocal" class="chip" type="button">Lokal, eigenes Passwort</button>
        <button id="syncDevice" class="chip" type="button">Anderes Gerät</button>
      </div>
      <input id="codeInput" type="text" minlength="4" placeholder="eigenes Passwort, mind. 4 Zeichen" autocomplete="off" />
      <img id="syncQr" alt="" hidden />
      <p id="syncLink" class="sync-link" hidden></p>
      <button id="copyLink" class="chip" type="button" hidden>Kopieren</button>
      <p id="syncMeta" class="login-error" hidden></p>
      <button id="codeOk" class="chip" type="submit">QR-Code erzeugen</button>
      <button id="codeCancel" class="ghost" type="button">Abbrechen</button>
      <p id="codeMessage" class="login-error"></p>
      <p id="syncInfo" class="login-error" hidden></p>
      <button id="syncDelete" class="chip danger" type="button" hidden>Alles löschen</button>
    </form>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
