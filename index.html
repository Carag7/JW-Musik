<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Karaoke für Smartphone, Tablet und Tesla-Browser. Liedliste, Player und LRC-Text." />
  <title>Tesla Karaoke</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="lieder-toggle" type="button" aria-expanded="true">Lieder</button>
    <div class="top-actions">
      <button id="smallerBtn" class="ghost" type="button" aria-label="Schrift kleiner">A−</button>
      <button id="largerBtn" class="ghost" type="button" aria-label="Schrift größer">A+</button>
      <button id="fullscreenBtn" class="ghost" type="button">Vollbild</button>
      <a id="lyricsLink" class="ghost text-link" href="https://www.jw.org/en/library/music-songs/sing-out-joyfully/" target="_blank" rel="noopener">Text</a>
    </div>
  </header>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <header class="brand">
        <div>
          <p class="eyebrow">Sing Out Joyfully</p>
          <h1>Karaoke</h1>
        </div>
        <button id="lyricSearchToggle" class="ghost" type="button" aria-label="Text suchen">⌕</button>
      </header>

      <label id="lyricSearchWrap" class="search-wrap" hidden>
        <span class="sr-only">Text suchen</span>
        <input id="lyricSearch" type="search" inputmode="search" placeholder="Wort im Liedtext" autocomplete="off" />
      </label>

      <label class="search-wrap">
        <span class="sr-only">Lied suchen</span>
        <input id="songSearch" type="search" inputmode="search" placeholder="Nummer oder Titel" autocomplete="off" />
      </label>

      <label class="search-wrap">
        <span class="sr-only">Kategorie</span>
        <select id="categoryFilter">
          <option value="">Alle Kategorien</option>
        </select>
      </label>

      <div class="filters">
        <button id="favoritesToggle" class="chip" type="button" aria-pressed="false">alle Lieder</button>
        <button id="shuffleBtn" class="chip" type="button" aria-pressed="false">Zufall</button>
        <span id="songCount" class="count">0</span>
      </div>

      <ul id="songList" class="song-list" aria-label="Lieder"></ul>
      <button id="toTopBtn" class="to-top" type="button" aria-label="Nach oben">↑</button>
    </aside>

    <main class="stage">
      <section class="now">
        <div class="title-row" id="titleRow" hidden>
          <p id="currentNumber" class="eyebrow song-number">—</p>
          <button id="favoriteBtn" class="star-btn" type="button" aria-pressed="false" aria-label="Favorit" hidden>☆</button>
        </div>
        <h2 id="currentTitle">Königreichslieder</h2>
        <div class="meta-row">
          <p id="currentCategory" class="meta"></p>
          <p id="currentStatus">Bereit</p>
        </div>
      </section>

      <section id="lyrics" class="lyrics" aria-live="polite">
        <div id="startPanel" class="start-panel">
          <p class="eyebrow">Sing Out Joyfully</p>
          <img class="start-image" src="start-bg.png" alt="" />
          <div class="start-actions">
            <button id="playAllBtn" class="chip" type="button">alle Lieder</button>
            <button id="playFavBtn" class="chip" type="button">Favoriten</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="flyer" aria-label="Wiedergabe">
    <div class="transport">
      <button id="back15" class="round" type="button" aria-label="15 Sekunden zurück">−15</button>
      <button id="prevBtn" class="round nav" type="button" aria-label="Vorheriges Lied">◀</button>
      <button id="playBtn" class="round play" type="button" aria-label="Play">▶</button>
      <button id="nextBtn" class="round nav" type="button" aria-label="Nächstes Lied">▶</button>
      <button id="fwd15" class="round" type="button" aria-label="15 Sekunden vor">+15</button>
    </div>
    <div class="timeline">
      <p id="prevSong" class="nav-song">—</p>
      <div class="bar-row">
        <span id="currentTime">0:00</span>
        <input id="progressBar" type="range" min="0" max="1000" value="0" aria-label="Position" />
        <span id="duration">0:00</span>
      </div>
      <p id="nextSong" class="nav-song">—</p>
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
