      <h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="wieder">Wiedergabe</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="wieder">Wie Lieder starten, weiterlaufen und gesteuert werden.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div data-tab="allgemein" data-sub="einst" class="autoplay-box" data-topic-box="1">
        <p class="ap-title" data-topics="wieder">Start und Weiterspielen</p>
        <label class="set-row check" data-topics="wieder"><input type="checkbox"> Beim Öffnen automatisch abspielen</label>
        <small class="set-hint" data-topics="wieder">Die Seite startet das zuletzt gehörte Lied von selbst, sobald du sie öffnest. Praktisch im Auto. Mit dem kleinen ⏵ oben rechts schaltest du das jederzeit um. Manche Browser erlauben den Start erst nach einem Tipp.</small>
        <label class="set-row check" data-topics="wieder"><input type="checkbox"> Automatisch nur Karaoke-Lieder spielen</label>
        <small class="set-hint" data-topics="wieder">Mit Haken läuft nach jedem Lied automatisch (in der Reihenfolge der Liste oder im Zufall) nur das nächste Karaoke-Lied weiter. Lieder, zu denen es noch keine Karaoke-MP3 gibt, werden übersprungen; die wählst du von Hand. Ohne Haken laufen auch diese Lieder automatisch mit. Die Tasten ◀ ▶ und die Auswahl in der Liste bleiben immer frei.</small>
      </div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="wieder">Start im Browser (stumm, Tipp, nach App-Wechsel)</p><label class="set-row" data-topics="wieder">Nach Rückkehr in den Browser <select><option value="pause">Pause bleibt Pause</option><option value="auto">wie bisher</option><option value="always">immer weiter</option></select></label><small class="set-hint" data-topics="wieder">Pause bleibt Pause: ein pausiertes Lied startet nach einem App-Wechsel nicht von selbst. Tesla-Standard: wie bisher.</small><label class="set-row check" data-topics="wieder"><input type="checkbox"> Ein Tipp irgendwo startet das Lied, wenn der Browser den Start blockiert</label><label class="set-row check" data-topics="wieder"><input type="checkbox"> Blockiert der Browser den Start: stumm beginnen, erster Tipp schaltet den Ton ein</label><small class="set-hint" data-topics="wieder">Beides auch durch langes Drücken auf die Autoplay-Taste (⏵ oben rechts) einstellbar.</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="wieder">Springen</p><label class="set-row" data-topics="wieder">Springen zurück (Sekunden) <input type="range" class="num-rng" min="1" max="300" step="1" title="Empfohlener Bereich: 1 bis 300" aria-label="Empfohlener Bereich: 1 bis 300"><input type="number" min="1" max="300" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><label class="set-row" data-topics="wieder">Springen vor (Sekunden) <input type="range" class="num-rng" min="1" max="300" step="1" title="Empfohlener Bereich: 1 bis 300" aria-label="Empfohlener Bereich: 1 bis 300"><input type="number" min="1" max="300" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><small class="set-hint" data-topics="wieder">So viele Sekunden springt die Taste rechts neben Play vor.</small></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="liste">Liedliste</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="liste">Was in der Liedliste steht und wie sie aussieht.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div data-tab="allgemein" data-sub="einst" class="autoplay-box" data-topic-box="1">
        <p class="ap-title" data-topics="liste">Weitere Lieder</p>
        <label class="set-row check" data-topics="liste"><input type="checkbox"> Weitere Lieder aus den anderen Verzeichnissen (Instrumental, Zusammenkünfte, Video) in der Liste anzeigen</label>
        <small class="set-hint" data-topics="liste">Normalerweise zeigt die Liste nur Lieder mit Karaoke-MP3. Mit dem Haken kommen auch Lieder dazu, die es nur als Instrumental, Zusammenkünfte-Aufnahme oder Video gibt. Dann erscheint bei aktiver Lupe eine Auswahl „Karaoke / Instrumental / Video / Zusammenkünfte“. Diese Lieder sind farblich abgesetzt und lassen sich ganz normal in Wiedergabelisten speichern.</small>
      </div><div data-tab="allgemein" data-sub="einst" class="autoplay-box" data-topic-box="1">
        <p class="ap-title" data-topics="liste">Kennzeichen in der Liste</p>
        <label class="set-row check" data-topics="liste"><input type="checkbox"> Kleine Art-Kennzeichen (K, ♪, ▶, Z) unter den Liedern in der Auswahl anzeigen</label>
        <label class="set-row check" data-topics="liste"><input type="checkbox"> Nur kurz einblenden (beim Start eines Liedes), mit der Maus darüber wieder anzeigen</label>
        <small class="set-hint" data-topics="liste">Die kleinen Buchstaben unter dem Liedtitel zeigen, bei welchen Arten ein Lied vorhanden ist. Im Tesla kannst du sie ausschalten, wenn sie stören. Sie erscheinen nur, wenn „Weitere Lieder“ aktiv ist.</small>
      </div><div data-tab="allgemein" data-sub="einst" class="autoplay-box" data-topic-box="1">

      </div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="text">Karaoke-Text</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="text">Wie der mitlaufende Text aussieht und in welcher Sprache die Musik läuft.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="text">Schrift und Lage</p><label class="set-row" data-topics="text">Schriftgröße Karaoke-Text <input type="range" class="num-rng" min="10" max="200" step="1" title="Empfohlener Bereich: 10 bis 200" aria-label="Empfohlener Bereich: 10 bis 200"><input type="number" min="10" max="200" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><label class="set-row" data-topics="text">Ausrichtung Karaoke-Text <select><option value="skin">Design</option><option value="left">links</option><option value="center">Mitte</option><option value="right">rechts</option></select></label><small class="set-hint" data-topics="text">„Design“ übernimmt die Ausrichtung des gewählten Designs. Sonst steht der Text immer links, in der Mitte oder rechts.</small><label class="set-row" data-topics="text">Höhe der aktiven Karaoke-Zeile (% von oben, Standard 33) <input type="range" class="num-rng" min="5" max="95" step="1" title="Empfohlener Bereich: 5 bis 95" aria-label="Empfohlener Bereich: 5 bis 95"><input type="number" min="5" max="95" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" ari div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="gal">Ansichten: Größe und Position</p><small class="set-hint" data-topics="gal">Lange auf Raster, Liste oder Karussell drücken (in der Galerie oben): Fenster zum Verschieben (Pfeile) und für die Größe der Cover. Hier kannst du die Werte auch eintippen.</small><div class="set-row v130-pos" data-topics="gal">Raster: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Raster nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Raster nach unten (px)" style="width: 5.5em;" value="0"></div><div class="set-row v130-pos" data-topics="gal">Liste: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Liste nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Liste nach unten (px)" style="width: 5.5em;" value="0"></div><div class="set-row v130-pos" data-topics="gal">Karussell: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Karussell nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Karussell nach unten (px)" style="width: 5.5em;" value="0"></div><button class="tz-btn tz-small" type="button" data-topics="gal">Anpassen-Fenster öffnen (Pfeile, Größe)</button><small class="set-hint" data-topics="gal">Versatz in Pixel je Ansicht. In der Galerie: lange auf Raster, Liste oder Karussell drücken.</small></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="start">Startseite</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="start">Was vor dem ersten Lied zu sehen ist.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div class= v><div class="set-row v130-pos" data-topics="start">Video: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Video nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Video nach unten (px)" style="width: 5.5em;" value="0"></div><div class="set-row v130-pos" data-topics="start">Karussell: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Karussell nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Karussell nach unten (px)" style="width: 5.5em;" value="0"></div><div class="set-row v130-pos" data-topics="start">Überblenden: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Überblenden nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Überblenden nach unten (px)" style="width: 5.5em;" value="0"></div><div class="set-row v130-pos" data-topics="start">Schweben: <span> rechts </span><input type="text" inputmode="numeric" title="nach rechts (px)" aria-label="Schweben nach rechts (px)" style="width: 5.5em;" value="0"><span> runter </span><input type="text" inputmode="numeric" title="nach unten (px)" aria-label="Schweben nach unten (px)" style="width: 5.5em;" value="0"></div><button class="tz-btn tz-small" type="button" data-topics="start">Anpassen-Fenster öffnen (Pfeile, Größe)</button><small class="set-hint" data-topics="start">Versatz in Pixel (rechts / runter, auch negativ). Auf der Startseite erreichst du dasselbe, wenn du lange auf eine Ansicht drückst.</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="start">Chor-GIF</p><label class="set-row check" data-topics="start"><input type="checkbox"> Startseite: GIF „Chor“ statt des Bildes zeigen</label></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="player">Player und Fernsteuerung</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="player">Player-Anordnung, Übertragen auf andere Geräte, Mithören.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="player">Player</p><label class="set-row" data-topics="player">Player: Anordnung <select><option value="auto">Auto</option><option value="fill">Im Bild</option><option value="split">Geteilt</option></select></label><small class="set-hint" data-topics="player">„Im Bild“: Titel und Tasten liegen über dem Cover. „Geteilt“ (Bild links, Player rechts): das Cover steht frei links, der Player getrennt rechts (ab ca. 640 px Breite). Die Taste oben im Player wechselt zwischen beiden.</small><label class="set-row" data-topics="player">Symbol „Auf anderem Gerät abspielen“ (Cast) <select><option value="always">Immer anzeigen</option><option value="lupe">Nur bei aktiver Lupe</option><option value="off">Aus</option></select></label><small class="set-hint" data-topics="player">Das Symbol steht in der Titelzeile neben ☆ und ＋. Es erscheint nur, wenn der Browser Übertragen kann (Chrome auf Android/Computer, Safari/AirPlay) – im Tesla-Browser gibt es diese Funktion nicht.</small><div class="set-row v130-tempo" data-topics="player">Tempo (1 = normal) <input type="range" class="num-rng" min="0.1" max="4" step="0.05" title="Empfohlener Bereich: 0.1 bis 4" aria-label="Empfohlener Bereich: 0.1 bis 4"><input type="number" min="0.1" max="4" step="0.05" data-stp="1" style="width: 5em;"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span><button class="chip" type="button">Normal (1x)</button></div><small class="set-hint" data-topics="player">Regler oder Zahl (0,1 bis 4). Gilt für alle Lieder, bis du auf „Normal“ stellst. Ist das Tempo nicht 1x, steht es im Player in Orange. Auch: Lupe an, linken Timecode lang drücken.</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="player">Tasten im Tesla-Player (unter den Fahrzeug-Infos)</p><label class="set-row" data-topics="player">Die kleinen Tasten sollen sein <select><option value="step">Lied vor / Lied zurück (Standard)</option><option value="seek">Vor- / Zurückspulen</option></select></label><small class="set-hint" data-topics="player">Standard: die Tasten funktionieren so, wie sie angezeigt werden – Lied vor und Lied zurück. Auch nach dem Ändern am besten ein Lied neu wählen.</small><label class="set-row check" data-topics="player"><input type="checkbox"> Lange gedrückt halten = vor- bzw. zurückspulen</label><small class="set-hint" data-topics="player">Kurz drücken wechselt das Lied (mit kurzer Verzögerung von etwa 0,4 s), gehalten spult. Aus: Taste wirkt sofort, kein Spulen.</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="player">Fernsteuerung</p><label class="set-row" data-topics="player">Fernsteuerung: Abfrage im Ruhezustand (Sekunden) <input type="range" class="num-rng" min="2" max="60" step="1" title="Empfohlener Bereich: 2 bis 60" aria-label="Empfohlener Bereich: 2 bis 60"><input type="number" min="2" max="60" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="listen">Listen und ähnliche Lieder</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="listen">Eigene und thematische Wiedergabelisten, ähnliche Lieder mit Prozent und Füllstand.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div data-tab="allgemein" data-sub="einst" class="autoplay-box" data-topic-box="1">
        <p class="ap-title" data-topics="listen">Mithören (anderes Gerät)</p>
        <label class="set-row check" data-topics="listen"><input type="checkbox"> Mithören ruckelfrei: nur beim Drücken auf Play synchronisieren, dann läuft das Lied hier selbstständig weiter</label>
        <small class="set-hint" data-topics="listen">Ohne Haken wird laufend nachgeführt (genauer, kann auf dem Handy stocken). Mit Haken springt dieses Gerät beim Play-Druck und beim Liedwechsel einmal zur richtigen Stelle und spielt dann ohne Eingriffe.</small>
      </div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="listen">Ähnliche Lieder</p><label class="set-row check" data-topics="listen"><input type="checkbox"> Knopf „Ähnliche Lieder“ in der Titelzeile des Players zeigen</label><small class="set-hint" data-topics="listen">Tippen: ähnliche Lieder spielen als Nächstes, wie eine Wiedergabeliste. Auch unter „Listen“ gibt es „Ähnliche Lieder“ mit Prozentwerten.</small><label class="set-row" data-topics="listen">Genauigkeit (Mindest-Ähnlichkeit) <select><option value="auto">Automatik – immer die ähnlichsten N Lieder</option><option value="60">sehr genau – nur sehr ähnliche (ab 60 %)</option><option value="45">genau (ab 45 %)</option><option value="30">normal (ab 30 %)</option><option value="22">locker (ab 22 %)</option><option value="15">sehr locker (ab 15 %)</option></select></label><small class="set-hint" data-topics="listen">Je strenger, desto weniger Lieder. In „Listen“ gibt es dafür zusätzlich einen Schieberegler.</small><label class="set-row" data-topics="listen">Automatik: Anzahl der ähnlichsten Lieder <input type="range" class="num-rng" min="1" max="60" step="1" title="Empfohlener Bereich: 1 bis 60" aria-label="Empfohlener Bereich: 1 bis 60"><input type="number" min="1" max="60" step="1" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><small class="set-hint" data-topics="listen">Gilt bei Genauigkeit „Automatik“, z. B. die 10 oder 5 ähnlichsten.</small><label class="set-row check" data-topics="listen"><input type="checkbox"> Prozentzahl bei jedem Lied anzeigen</label><label class="set-row check" data-topics="listen"><input type="checkbox"> Zeilen als Füllstand färben (von links, wie ein liegendes Glas)</label><small class="set-hint" data-topics="listen">Jede Zeile wird zur Ähnlichkeit in Prozent von links gefüllt – gut lesbar im Auto. Aus: nur die Prozentzahl.</small><label class="set-row" data-topics="listen">Deckung der Farbe beim Bezugslied (%) <input type="range" class="num-rng" min="0" max="100" step="1" title="Empfohlener Bereich: 0 bis 100" aria-label="Empfohlener Bereich: 0 bis 100"><input type="number" min="0" max="100" step="1" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><label class="set-row" data-topics="listen">Deckung der Füllung bei den anderen Liedern (%) <input type="range" class="num-rng" min="0" max="100" step="1" title="Empfohlener Bereich: 0 bis 100" aria-label="Empfohlener Bereich: 0 bis 100"><input type="number" min="0" max="100" step="1" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="listen">Eigene Wiedergabelisten</p><label class="set-row" data-topics="listen">Lange drücken auf eine Liste (Sekunden, mind. 2) = Umbenennen/Löschen (nur mit aktiver Lupe) <input type="range" class="num-rng" min="2" max="10" step="1" title="Empfohlener Bereich: 2 bis 10" aria-label="Empfohlener Bereich: 2 bis 10"><input type="number" min="2" max="10" step="1" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label><small class="set-hint" data-topics="listen">Bei aktiver Lupe unter „Listen“ eine eigene Liste lange gedrückt halten: dann erscheinen Umbenennen und Löschen. Sie verschwinden wieder, sobald eine andere Liste gewählt wird.</small></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="ki">KI und Bewertungen</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="ki">KI-Abstimmung, KI-Text beim Lied, Bewertungen und Verlauf.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="ki">KI-Text beim Lied (Scan im ＋-Fenster)</p><label class="set-row" data-topics="ki">Genauigkeit des KI-Scans <select><option value="low">schwach (schnell)</option><option value="normal">normal</option><option value="high">sehr genau (langsam)</option></select></label><small class="set-hint" data-topics="ki">Standard: sehr genau.</small><label class="set-row check" data-topics="ki"><input type="checkbox"> Knopf „KI“ nur zeigen, wenn ein nicht gespeicherter KI-Text vorhanden ist</label><small class="set-hint" data-topics="ki">Ein: nach dem Speichern als Standard verschwindet der Knopf. Aus: der Knopf bleibt, sobald es mehrere Karaoke-Texte gibt (zum Auswählen). Ist ein anderer Text gewählt, leuchtet er farbig.</small><label class="set-row check" data-topics="ki"><input type="checkbox"> KI-Text zuerst verwenden, wenn vorhanden</label><small class="set-hint" data-topics="ki">Dann zeigt die Titelzeile den Knopf „KI“: kurz tippen wechselt zwischen KI-Text und gespeichertem Text, lange drücken speichert den KI-Text als Standard (mit Schlüssel).</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="ki">KI-Sync im Bearbeiten-Modus</p><label class="set-row" data-topics="ki">Genauigkeit der KI-Abstimmung <select><option value="low">schwach (schnell)</option><option value="normal">normal</option><option value="high">sehr genau (langsam)</option></select></label><small class="set-hint" data-topics="ki">Wird auch im Fenster „Zeiten automatisch setzen“ gewählt.</small><label class="set-row check" data-topics="ki"><input type="checkbox"> Auswahl-Knöpfe dauerhaft in der Leiste anzeigen</label></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="ki">Bewertungen</p><label class="set-row check" data-topics="ki"><input type="checkbox"> Bewertung im ＋-Fenster zeigen</label><label class="set-row check" data-topics="ki"><input type="checkbox"> Korrektur-Status (rot/orange/grün) in der Liedliste zeigen</label><label class="set-row" data-topics="ki">Mein Name für Bewertungen <input type="text" maxlength="40" placeholder="leer = anonym" value=""></label><label class="set-row check" data-topics="ki"><input type="checkbox"> KI-Verlauf: beide Spalten gemeinsam scrollen</label><label class="set-row check" data-topics="ki"><input type="checkbox"> KI-Verlauf: breit anzeigen (großer Bildschirm)</label></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="einfach">Einfache Ansicht</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="einfach">Was ohne Lupe zu sehen ist. Weniger Knöpfe = weniger Ablenkung beim Fahren. Mit aktiver Lupe ist immer alles sichtbar.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="einfach">Knöpfe ohne Lupe sichtbar machen</p><small class="set-hint" data-topics="einfach">Hier legst du fest, welche Knöpfe ohne Lupe sichtbar sind: Ein = der Knopf bleibt auch ohne Lupe sichtbar, Aus = er erscheint nur mit Lupe. So bleibt die Oberfläche ruhig, und du blendest nur ein, was du wirklich brauchst.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Hinweis auf die Zweitfunktion (langes Drücken) unter dem Knopf zeigen</label><small class="set-hint" data-topics="einfach">Knöpfe mit einer zweiten Funktion bei langem Drücken bekommen eine eingerückte Zeile darunter.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Titelzeile: ＋ (Wiedergabeliste, Bewertung)</label><small class="set-hint sv-lp" data-topics="einfach">↳ Antippen: Wiedergabeliste, Bewertung und KI-Scan.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Titelzeile: Sprache der Musik</label><small class="set-hint sv-lp" data-topics="einfach">↳ Lang drücken: Spur (Deutsch/Englisch) und Karaoke-Text wählen.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Titelzeile: Übertragen auf anderes Gerät</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Titelzeile: Knopf „KI“</label><small class="set-hint sv-lp" data-topics="einfach">↳ Lang drücken: KI-Text als Standard speichern oder anderen Karaoke-Text wählen.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Liste: Sprache der Musik</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Liste: Kennzeichen ein/aus</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Player: Knopf „Welle“</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Liste: Zufall</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Liste: alle Lieder / Favoriten</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Player: Favoriten-Stern unten</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Player: Springen (−15 / +15)</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Oben: Schrift A− / A+</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Oben: Vollbild</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Oben: Design</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Oben: Text (Liedtext-Seite)</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Startseite: Zusatzmenü</label><label class="set-row check" data-topics="einfach"><input type="checkbox"> Autoplay-Symbol: langes Drücken auch ohne Lupe</label><small class="set-hint sv-lp" data-topics="einfach">↳ Das Autoplay-Symbol öffnet bei langem Drücken die Autoplay-Einstellungen.</small></div><div class="autoplay-box v128-box" data-topic-box="1"><p class="ap-title" data-topics="einfach">Weitere Bedienung</p><label class="set-row check" data-topics="einfach"><input type="checkbox"> Lang auf „Pause / Spielt“ drücken: Korrektur-Status (rot/orange/grün) setzen</label><small class="set-hint" data-topics="einfach">Große Tasten für die Fahrt, untereinander wie eine Ampel; derselbe Status wie unter Anpassungen → Bewertungen.</small><small class="set-hint sv-lp" data-topics="einfach">↳ Linker Timecode, lang gedrückt (mit Lupe): Wiedergabe-Tempo einstellen.</small><label class="set-row check" data-topics="einfach"><input type="checkbox"> Lupe und Player-Symbol nur nach langem Drücken</label></div></div><h3 class="set-grp" data-tab="allgemein" data-sub="einst" data-v128="anz">Abstände und Schutz</h3><p class="set-grp-d" data-tab="allgemein" data-sub="einst" data-v128="anz">Platz am Rand, Schutz vor versehentlichem Tippen, Anzeigegröße.</p><div class="tp-sec" data-tab="allgemein" data-sub="einst"><div data-tab="allgemein" data-sub="einst" class="autoplay-box adv-part" data-topic-box="1">
        <p class="ap-title" data-topics="anz">Abstände, Schutz und Anzeigegröße</p>
        <label class="set-row two" data-topics="anz"><span class="lbl">Abstand oben<br>Hauptfenster (px)</span> <input type="range" class="num-rng" min="0" max="300" step="1" title="Empfohlener Bereich: 0 bis 300" aria-label="Empfohlener Bereich: 0 bis 300"><input type="number" min="0" max="300" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label>
        <small class="set-hint" data-topics="anz">Zusätzlicher Platz am oberen Rand der Hauptseite. Hilfreich, wenn das Gerät oder der Tesla oben etwas verdeckt.</small>
        <label class="set-row two" data-topics="anz"><span class="lbl">Abstand oben<br>Einstellungen (px)</span> <input type="range" class="num-rng" min="0" max="300" step="1" title="Empfohlener Bereich: 0 bis 300" aria-label="Empfohlener Bereich: 0 bis 300"><input type="number" min="0" max="300" inputmode="numeric" data-stp="1"><span class="stp"><button type="button" aria-label="um 1 erhöhen" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 16l7-8 7 8z" fill="currentColor"></path></svg></button><button type="button" aria-label="um 1 verringern" tabindex="-1"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M5 8l7 8 7-8z" fill="currentColor"></path></svg></button></span></label>
        <small class="set-hint" data-topics="anz">Dasselbe für dieses Einstellungsfenster.</small>
        <label class="set-row check" data-topics="anz"><input type="checkbox"> Lupe und Player-Symbol nur nach langem Drücken (ca. 0,7 s)</label>
        <small class="set-hint" data-topics="anz">Schützt vor versehentlichem Antippen, zum Beispiel beim Fahren: Die Symbole reagieren erst, wenn du sie etwa 0,7 Sekunden hältst.</small>
        <label class="set-row check" data-topics="anz"><input type="checkbox"> Dabei Hinweis „Länger drücken“ und Fortschrittsbalken anzeigen</label>
        <small class="set-hint" data-topics="anz">Zeigt beim Halten einen Hinweis und einen Balken, damit du siehst, wie lange noch.</small>
        <small class="set-hint" data-topics="anz">Fensterbereich dieser Seite: 1280 × 900 px · Bildschirm: 1280 × 900 · Pixeldichte: 1</small>
        <button type="button" class="chip" data-topics="anz">Anzeigegröße genau messen</button>

<script>
/* Vorschau-Seite: zeigt die Oberfläche mit einem Design (kein Programmcode der App).

(function(){
  var q=new URLSearchParams(location.search), r=document.documentElement, t=q.get("t")||"klassisch", v=q.get("v")||"play";
  if(t!=="klassisch") r.setAttribute("data-theme",t);
  if(q.get("l")==="1") r.setAttribute("data-light","1");

  var hd=q.get("hide"); if(hd){ var st=document.createElement("style"); st.textContent=hd.split("|").filter(Boolean).map(function(s){return s+"{display:none!important}";}).join("\n"); document.head.append(st); }
  document.body.classList.add("pv-"+v);
  if(innerWidth<=760&&(v==="play"||v==="start"||v==="kar")){ var ap=document.querySelector(".app"); if(ap) ap.classList.add("sidebar-hidden"); }
  var B=(q.get("b")||"").replace(/\/$/,""), IDS=["003","010","025","051","075","120","139","150"];

      var W=box.clientWidth||600,H=box.clientHeight||360,ch=Math.min(H*0.9,W*1.475*0.5),cw=ch/1.475,step=Math.min(cw*0.62,W*0.3); box.replaceChildren();

    }

    o.querySelectorAll(".cg-art").forEach(function(a){ a.insertBefore(cover(a.dataset.id,"cg-img"),a.firstChild); });

    o2.innerHTML=document.getElementById("tSet").innerHTML; document.body.append(o2);
  }

})();
