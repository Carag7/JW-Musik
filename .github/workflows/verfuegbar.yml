name: Verfügbarkeit prüfen

on:
  schedule:
    - cron: "40 5 * * 1"   # einmal pro Woche: montags 05:40 UTC
  workflow_dispatch:        # manuell startbar (Actions -> Verfügbarkeit prüfen -> Run workflow)

permissions:
  contents: write

concurrency:
  group: verfuegbar
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Veröffentlichte Lieder abfragen
        run: python scrape_verfuegbar.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verfuegbar.json
          git diff --cached --quiet || (git commit -m "Verfügbarkeit aktualisiert" && git pull --rebase && git push)
