<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1D3D"/>
      <stop offset="100%" stop-color="#1C4D8C"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3C96B"/>
      <stop offset="100%" stop-color="#D4A13A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#000000"
                    flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Buch -->
  <g filter="url(#shadow)">
    <path
      d="M32 34
         C32 29 36 26 42 26
         H64
         V92
         H42
         C36 92 32 96 32 102
         Z"
      fill="#FFFFFF"/>

    <path
      d="M96 34
         C96 29 92 26 86 26
         H64
         V92
         H86
         C92 92 96 96 96 102
         Z"
      fill="#F2F5F8"/>

    <line
      x1="64"
      y1="26"
      x2="64"
      y2="92"
      stroke="#D3D9DF"
      stroke-width="2"/>
  </g>

  <!-- Seitenlinien -->
  <line x1="42" y1="42" x2="57" y2="42"
        stroke="#D8DEE5" stroke-width="1.5"/>
  <line x1="42" y1="50" x2="57" y2="50"
        stroke="#D8DEE5" stroke-width="1.5"/>

  <line x1="71" y1="42" x2="86" y2="42"
        stroke="#D8DEE5" stroke-width="1.5"/>
  <line x1="71" y1="50" x2="86" y2="50"
        stroke="#D8DEE5" stroke-width="1.5"/>

  <!-- Musiknote -->
  <g filter="url(#shadow)">
    <circle cx="84" cy="83" r="10" fill="url(#gold)"/>

    <rect
      x="89"
      y="48"
      width="6"
      height="35"
      rx="3"
      fill="url(#gold)"/>

    <path
      d="M95 48
         C104 49 111 52 116 57
         V66
         C111 61 104 58 95 57
         Z"
      fill="url(#gold)"/>
  </g>
</svg>
